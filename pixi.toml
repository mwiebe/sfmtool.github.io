[workspace]
authors = ["Mark <399551+mwiebe@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "sfmtool-docs"
platforms = ["win-64", "linux-64", "osx-arm64"]
version = "0.1"

[dependencies]
python = ">=3.14.7,<3.15"

# Zensical is pre-1.0 in the 0.0.x series, where the patch component is the
# only thing that moves and every release is allowed to break. So the pin is a
# single patch rather than a semver range: the docs build is only ever exercised
# against the one version we checked it against, and moving it forward is a
# deliberate commit that rebuilds the site and diffs the output. Bump the whole
# window (`>=0.0.N, <0.0.N+1`) rather than widening it.
[pypi-dependencies]
zensical = ">=0.0.72, <0.0.73"

[tasks]
docs-serve = "zensical serve"
docs-build = "zensical build && python scripts/add_legacy_redirects.py site"
